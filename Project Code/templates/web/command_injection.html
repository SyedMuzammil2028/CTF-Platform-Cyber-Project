
{% extends "base.html" %}
{% block content %}
<h2 class="section-title">Ping of Death Note (Command Injection)</h2>
<div style="max-width: 800px; margin: 0 auto; text-align:center;">

<p>Network debug panel. It pings whatever host you ask for. Shell met a semicolon once...</p>
<form method="POST">
    <input name="host" placeholder="Host to ping (e.g. 8.8.8.8)" class="flag-input"><br>
    <button class="btn btn-primary" style="margin-top:10px;">Ping</button>
</form>
{% if output %}
    <pre style="margin-top:18px; text-align:left; background:#111; padding:14px; border-radius:10px;">{{ output }}</pre>
{% elif error %}
    <p style="color:#ff5252; margin-top:12px;">{{ error }}</p>
{% endif %}

</div>
{% endblock %}
